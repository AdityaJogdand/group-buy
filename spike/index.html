<!doctype html>
<title>v6 spike</title>
<paypal-button id="paypal-button" type="pay" hidden></paypal-button>
<pre id="status">loading</pre>
<script>
  const status = (s) => (document.querySelector('#status').textContent = s);

  async function onPayPalWebSdkLoaded() {
    try {
      const sdk = await window.paypal.createInstance({
        clientId: '__CLIENT_ID__', components: ['paypal-payments'], pageType: 'checkout',
      });
      const session = sdk.createPayPalOneTimePaymentSession({
        async onApprove({ orderId }) {
          if (location.search.includes('nocapture')) return status(`approved ${orderId}`);
          const r = await fetch(`/api/orders/${orderId}/capture`, { method: 'POST' }).then(r => r.json());
          status(`captured ${orderId} ${r.status}`);
        },
        onCancel: () => status('cancelled'),
        onError: (e) => status(`error ${e.message}`),
      });
      const button = document.querySelector('#paypal-button');
      button.hidden = false;
      button.addEventListener('click', () => {
        // Don't await createOrder before start(): it breaks the popup's transient activation.
        const order = fetch('/api/orders' + location.search, { method: 'POST' }).then(r => r.json()).then(o => ({ orderId: o.id }));
        session.start({ presentationMode: 'auto' }, order).catch(e => status(`error ${e.message}`));
      });
      status('ready');
    } catch (e) {
      status(`init error ${e.message}`);
    }
  }
</script>
<script async src="https://www.sandbox.paypal.com/web-sdk/v6/core" onload="onPayPalWebSdkLoaded()"></script>
